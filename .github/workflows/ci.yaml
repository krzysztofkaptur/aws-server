name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "checkout"
        uses: actions/checkout@v7

      - name: "setup pnpm"
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: "setup node"
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: "install packages"
        run: pnpm ci
        shell: bash

      - name: "build the app"
        run: pnpm run build

